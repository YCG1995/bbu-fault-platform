    # 中断（基址 0xd000）
    "0xd000": {name: PP1S 中断清除, rw: R/W, bits: {"0": "事件清除(高有效)"}}
    "0xd004": {name: PP1S 中断设置, rw: R/W, bits: {"0": "屏蔽输出管脚中断(不屏蔽内部)", "1": "模拟中断(高有效)"}}
    "0xd008": {name: PP1S 中断寄存器, rw: R, bits: {"1": "实时状态(1ms 低脉冲)", "0": "中断事件(软件清)"}}
    "0xd00c": {name: 普通中断清除, rw: R/W, bits: {"15:0": "每 bit 一路中断,1 有效"}}
    "0xd010": {name: 普通中断模拟, rw: R/W, bits: {"0": "时钟错误(本板/对板时钟差 A/B/B2 类)", "1": "主备状态切换(主变备)", "2": "状态切换(备响应软件请求)", "3": "对板复位(EPLD 单独复位 FPGA)", "4": "对板拔出(检测不到对板时钟)", "14": "面板主备按键倒换"}}
    "0xd014": {name: 普通中断掩码, rw: R/W, bits: {"15:0": "1=禁止/0=允许,只屏蔽输出管脚"}}
    "0xd018": {name: 普通中断状态(实时), rw: R, bits: {"15:0": "bit 定义同 0xd010"}}
    "0xd01c": {name: 普通中断事件, rw: R, bits: {"15:0": "高有效,软件清;bit 定义同 0xd010"}}
    # 光模块告警（基址 0xd020；公共 bit：bit9-8=QSFP2、bit7-6=QSFP1、bit5-3=光模块2、bit2-0=光模块1，均按 los/错误/不在位）
    "0xd020": {name: 光模块告警事件清零, rw: R/W, bits: {"15:0": "对应 bit 置1 上升沿清零事件"}}
    "0xd024": {name: 光模块告警错误模拟, rw: R/W, bits: {"15:0": "对应 bit 置1 模拟告警"}}
    "0xd028": {name: 光模块告警状态(实时), rw: R, bits: {"15:0": "1=实时告警"}}
    "0xd02c": {name: 光模块告警事件, rw: R, bits: {"15:0": "1=已发生告警(事件)"}}
    "0xd030": {name: 光模块告警次数清零, rw: R/W}
    "0xd034": {name: SFP 不在位告警次数, rw: R, bits: {"15:8": "光模块2", "7:0": "光模块1"}}
    "0xd038": {name: SFP 错误告警次数, rw: R, bits: {"15:8": "光模块2 tx_fault", "7:0": "光模块1 tx_fault"}}
    "0xd03c": {name: SFP los 告警次数, rw: R, bits: {"15:8": "光模块2 rx_los", "7:0": "光模块1 rx_los"}}
    "0xd040": {name: QSFP 不在位告警次数, rw: R, bits: {"15:8": "QSFP2", "7:0": "QSFP1"}}
    "0xd044": {name: QSFP 中断告警次数, rw: R, bits: {"15:8": "QSFP2", "7:0": "QSFP1"}}
    "0xd048": {name: 面板主备按键次数计数, rw: R}
    "0xd04c": {name: DSFP 不在位告警次数, rw: R}
    "0xd050": {name: DSFP 中断告警次数, rw: R}


# === VSWe 维测手册补充（单板域：VSWe）===
# 来源：VSWe 时钟维测手册（告警/网管/前台/CLK 日志语义，v2.9.8 沉淀）

# === SSM 质量等级（CLK[011] SsmQL）===
CLK011_SsmQL:
  desc: SSM 质量等级（CLK[011] SsmQL）
  values:
    2: PRC 正常
    other: 异常（外场按实际配置判断）

# === CLK[037] SDR1588ATR 指示码（行首 %03u）===
CLK037_ATR:
  desc: SDR1588ATR 算法控制异常指示码（CLK[037] 行首 %03u）
  bits:
    0: 主相位对齐
    1: TOffset/PDV 异常
    2: Freq 抖动异常
    3: 1588 宽松同步辅助相位控持续时间超过 1h
    4: 滤波不可用超过 360 次
    5: 后台手动调整 Offset
    6: 通过调整 OCXO 频偏调整相位
    7: 进入快捕时刻（非异常，记录用）

# === 时钟保持能力（BspGetHoldCapability / ulHoldCapability / Hold Capability）===
HOLD_CAPABILITY:
  desc: 时钟保持能力（BspGetHoldCapability / ClockDiagInfoShow ulHoldCapability）
  values:
    0: 没有保持能力
    1: 1 小时保持能力
    2: 4 小时保持能力
    3: 24 小时保持能力
    4: SYNCE 增强保持

# === VSWe 主控 CLK[099] 行格式（与 VBP ClkHealth 不同域）===
# 行格式：10MHz=%u 80MHz=%u NetPll=%u Pps=%u Fsync=%03x 50Chip=%03x SesPLL=%u PLost=%u
CLK099_VSWE:
  desc: VSWe 主控 CLK[099] 行字段与 50Chip 位定义（VBP 用 CLK099_CLKHEALTH_VBP）
  board: VSWe
  line_format: "10MHz=%u 80MHz=%u NetPll=%u Pps=%u Fsync=%03x 50Chip=%03x SesPLL=%u PLost=%u"
  fields:
    "10MHz": {desc: 本地 10M 状态, values: {"0": "正常", "1": "本地 10M 丢失(PLL 检测 OCXO 丢失,xx18 扩展方式待定)"}}
    "80MHz": {desc: 鉴相 250M 状态, values: {"0": "正常", "1": "鉴相 250M 时钟错误(0xc488)"}}
    NetPll: {desc: 网口 PLL 状态, values: {"0": "正常", "1": "SYNCE 或 CPU 环失锁"}}
    Pps: {desc: PPS 状态, note: 含义同 PpsStat 枚举}
    Fsync: {desc: FSYNC 告警状态寄存器值(0x0c4xx 系列), note: 位定义见 50chip}
    SesPLL: {desc: DCO/CPRI 环, values: {"0": "正常", "1": "DCO 或 CPRI 环失锁"}}
    PLost: {desc: 鉴相值获取, values: {"0": "正常", "1": "持续 1min 从 FPGA 获取鉴相状态 error"}}
  50chip:
    fsync_bits: {0: FSYNC1 校验告警(1=故障), 1: FSYNC1 失步告警, 2: FSYNC1 晚到告警, 3: FSYNC1 早到告警, 8: FSYNC2 校验告警, 9: FSYNC2 失步告警, 10: FSYNC2 晚到告警, 11: FSYNC2 早到告警}
    serdes_bits: {2: "0 路输出反馈 SERDES 时钟丢失", 3: "1 路", 4: "2 路", 5: "3 路", 6: "4 路", 7: "5 路"}
    chip50_bits: {8: "10ms 计时 50chip 时钟错误", 9: "同步 50chip 时钟错误", 10: "级联 50chip 时钟错误", 11: "HW 50chip 时钟错误(仅 CC4/5/6)"}
    note: 原文两段位定义在 bit2-3/8-11 重叠矛盾（fsync 位 vs serdes/50chip 位），沉淀保留两段并以实测为准
