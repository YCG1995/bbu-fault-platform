  # --------------------------------------------------------------------------
  - code: "198096837"
    name: "GNSS接收机搜星故障"
    applicable:
      devices: ["ITBBU"]
      boards: ["VSWc0", "VSWc1", "VSWc2", "VSWd"]
    default_severity: "重要"
    reason_codes:
      "1": "GNSS接收机搜星不足"
      "2": "GNSS接收机信号不可用"
      "3": "GNSS接收机信号降质"
      "4": "GNSS接收机锁星失败"
    detection:
      "1": "卫星模块初始 720s 后搜星不足 4 颗，且未进入 3Dfix/timeonlyfix 超防抖"
      "2": "频偏>50ppb 或相位>20us 或闰秒=0 或 TOD<2018 或经纬度变化>0.01度，持续超防抖"
      "3": "PPS 跳变>100ppb（与其他参考源近同幅跳变）或与其他参考源相位差都>1.5us，持续超防抖"
      "4": "可见且载噪比>35dB 的卫星 ≥6 颗，但锁定 <4 颗，持续 120s 以上"
    detect_cycle: {BSP: "1s", AMP: "4s"}
    debounce: {BSP: {raise: 180, clear: 120}, AMP: {raise: 12, clear: 12}}
    thresholds:
      init_grace_s: 720
      min_satellites: 4
      min_lock_satellites: 4
      visible_strong_satellites: 6
      strong_cno_db: 35
      lock_fail_persist_s: 120
      freq_offset_ppb: 50
      phase_us: 20
      leap_sec_zero: 0
      tod_min_year: 2018
      pos_change_deg: 0.01
      jump_ppb: 100
      phase_diff_us: 1.5
    business_impact: "无其他备用时钟源时系统时钟偏差增大，影响业务"
    related_files: *gnss_files
    handling:
      "1/4": "检查天线方向遮挡→换位置/清遮挡；扫频仪排查 GNSS 干扰源并清除；换天线；复位/更换单板"
      "2": "检查是否配置 ≥2 时钟源；诊断时钟相位差>20us；空口频谱干扰分析；闭塞激活源观察；上站核对经纬度、排查干扰"
      "3": "核对 GNSS 线缆长度；确认是否先前有搜星不足；上站核对经纬度、排查干扰"
    source: "主控时钟告警手册（用户提供 2026-10-21）"
    verified: true

