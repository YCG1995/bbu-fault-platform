        - "更换告警单板"
    source: "主控时钟告警手册（用户提供 2026-10-21）"
    verified: true

  # --------------------------------------------------------------------------
  - code: "198096836"
    name: "GNSS天馈链路故障"
    applicable:
      devices: ["ITBBU"]
      boards: ["VSWc0", "VSWc1", "VSWc2", "VSWd"]
    default_severity: "重要"
    reason_codes:
      "1": "天馈开路"
      "2": "天馈短路"
    detection:
      "1": "逻辑检测到天馈开路且持续超防抖"
      "2": "逻辑检测到天馈短路且持续超防抖"
    detect_cycle: {BSP: "1s", AMP: "4s"}
    debounce: {BSP: {raise: 180, clear: 120}, AMP: {raise: 100, clear: 60}}
    business_impact: "无其他备用时钟源时系统时钟偏差增大，影响业务"
    related_files: *gnss_files
    related_alarms: ["198096837"]
