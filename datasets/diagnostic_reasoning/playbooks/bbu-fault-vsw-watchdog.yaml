strategy: 先由 Simplelog 确认确实发生看门狗复位，再用 kernel 判断 MCE/panic，最后用 BoardInit 的 EPLD 寄存器区分
  CPU 中断与电源跌落；MCE 优先于寄存器异常，中断优先于电源。
decision_order:
- order: 1
  action: 首先确认复位日志，看看门狗复位的频率，做记录
  rule_ids:
  - E1
  if_hit: 继续用命中证据校验对应根因条件
  if_miss: 记录该证据缺失，不用缺失反推根因
- order: 2
  action: 确认内核日志，是否匹配到看门狗复位的相关关键字，若匹配到关键字，可能是看门狗复位的根因
  rule_ids:
  - E2
  if_hit: 继续用命中证据校验对应根因条件
  if_miss: 记录该证据缺失，不用缺失反推根因
- order: 3
  action: 确认BoardInit启动日志，相关寄存器是否有异常，若有异常，可能是看门狗复位的根因
  rule_ids:
  - E3
  - E4
  if_hit: 继续用命中证据校验对应根因条件
  if_miss: 记录该证据缺失，不用缺失反推根因
hypotheses:
- id: H1
  root_cause: R1
  name: MCE/Kernel panic 导致看门狗复位
  condition: E1 and E2
  supporting_rules:
  - E1
  - E2
  excluding_rules: []
  expected_evidence:
  - 复位日志记录看门狗复位
  - 内核记录 MCE 或 Kernel panic
  why: CPU 机器检查异常或内核 panic 触发主控板看门狗复位
- id: H2
  root_cause: R2
  name: CPU 中断异常导致看门狗复位
  condition: E3 and not E2
  supporting_rules:
  - E3
  excluding_rules:
  - E2
  expected_evidence:
  - EPLD 中断状态/事件寄存器非零
  why: EPLD 中断状态或事件寄存器非零，说明 CPU 上报过中断；该证据可独立判定，不要求案例必须同时包含 Simplelog
- id: H3
  root_cause: R3
  name: 板内电源跌落导致看门狗复位
  condition: E4 and not E2 and not E3
  supporting_rules:
  - E4
  excluding_rules:
  - E2
  - E3
  expected_evidence:
  - EPLD 电源 PG 时间寄存器非零
  why: 电源 PG 时间寄存器非零，说明板内电源出现过跌落；该证据可独立判定，不要求案例必须同时包含 Simplelog
discriminators:
- rule_id: E2
  meaning: 内核记录 MCE 或 Kernel panic
  supports:
  - MCE/Kernel panic 导致看门狗复位
  excludes:
  - CPU 中断异常导致看门狗复位
  - 板内电源跌落导致看门狗复位
  use: 先看 E2；命中时优先验证MCE/Kernel panic 导致看门狗复位，并排除CPU 中断异常导致看门狗复位、板内电源跌落导致看门狗复位
- rule_id: E3
  meaning: EPLD 中断状态/事件寄存器非零
  supports:
  - CPU 中断异常导致看门狗复位
  excludes:
  - 板内电源跌落导致看门狗复位
  use: 先看 E3；命中时优先验证CPU 中断异常导致看门狗复位，并排除板内电源跌落导致看门狗复位
checks:
- 看门狗复位频率：若1个月内出现3次看门狗复位，则算作频繁出现；若小于此频率，算作偶发
- '内核打印异常：mce: [Hardware Error]；Kernel panic'
- BoardInit启动日志记录异常：0x630/0x634任意一个非0；0x664/0x674任意一个非0
- 0x630 bit4为I_cpu_caterr_n；0x664 bit7为I_vccin_cpu_pg
pitfalls:
- 只有告警名或单次复位记录，不能直接判定根因；必须先看复位频率和可用日志源。
- 0x630/0x634、0x664/0x674 全 0 表示无对应异常，不能把“寄存器存在”当成“寄存器异常”。
- caterr 与电源寄存器同时非 0 时，按证据优先级先判 CPU 中断；只有 BoardInit 时也可独立判定，但仍应在报告中提示缺少 Simplelog。
- MCE/Kernel panic 若与寄存器异常并存，优先由内核直接证据解释复位。
stop_conditions:
- E1+E2 成立：优先判 MCE/Kernel panic，停止再扩根因。
- E3 成立且 E2 不成立：判 CPU 中断，停止。
- E4 成立且 E2/E3 均不成立：判电源跌落，停止。
- 所有根因条件不成立：输出 unmatched，不猜测。
data_needed:
- 复位日志
- 内核日志
- BoardInit 启动日志
