schema: bbu-workshop-recipe/1
id: vsw-ssd
skill_slug: vsw-ssd
name: VSW 单板 SSD 故障
title: VSW 单板 SSD 故障分析
category: 单板存储类
version_scope: "V9200 / VSW 单板；具体版本范围待补充"
description: "VSW 单板出现 SSD 不可用、SSD 不在位、容器异常或升级失败时，用本配方筛查内核 I/O/SATA 错误和 SMART 健康字段。"
aliases:
  - SSD 故障
  - SSD故障
  - 固态硬盘故障
keywords:
  - SSD
  - 固态硬盘
  - 寿命
  - SATA
  - SMART
verified: false
sample_cases:
  positive:
    - case-02-io
    - case-03-sata
    - case-04-life
    - case-05-sector
  negative:
    - case-01-normal
default_actions:
  - "按现场作业指导书处理（待补充）"
trigger:
  all_terms:
    - "ssd"
  any_terms:
    - "remain life percentage"
    - "comreset failed"
    - "uncorrectable sector count"
    - "reallocated sectors count"
    - "blk_update_request"
rules:
  - id: E1
    description: "内核记录 SSD 直接 I/O 错误"
    source: kernel
    when_any:
      - "blk_update_request: i/o error"
      - "buffer i/o error on dev sda"
      - "read log dma ext failed"
      - "failed command: read fpdma queued"
      - "failed command: write fpdma queued"
    any_of:
      - pattern: "blk_update_request: I/O error"
        when_any:
          - "blk_update_request: i/o error"
      - pattern: "Buffer I/O error on dev sda"
        when_any:
          - "buffer i/o error on dev sda"
      - pattern: "READ LOG DMA EXT failed"
        when_any:
          - "read log dma ext failed"
      - pattern: "failed command: READ FPDMA QUEUED"
        when_any:
          - "failed command: read fpdma queued"
      - pattern: "failed command: WRITE FPDMA QUEUED"
        when_any:
          - "failed command: write fpdma queued"
  - id: E2
    description: "内核记录 SSD SATA 链路异常"
    source: kernel
    when_any:
      - "comreset failed"
      - "ata bus error"
      - "softreset failed"
      - "serror:"
    any_of:
      - pattern: "COMRESET failed"
        when_any:
          - "comreset failed"
      - pattern: "ATA bus error"
        when_any:
          - "ata bus error"
      - pattern: "softreset failed"
        when_any:
          - "softreset failed"
      - pattern: "SError:"
        when_any:
          - "serror:"
  - id: E3
    description: "SMART 剩余寿命低于 30%"
    source: board
    when_any:
      - "remain life percentage"
    any_of:
      - pattern: "169\\s+\\d+\\s+(?:[0-9]|[12][0-9])\\s+Remain Life Percentage"
        regex: true
  - id: E4
    description: "SMART 存在不可修复扇区"
    source: board
    when_any:
      - "uncorrectable sector count"
    any_of:
      - pattern: "160\\s+\\d+\\s+[1-9]\\d*\\s+Uncorrectable Sector Count"
        regex: true
  - id: E5
    description: "SMART 存在重映射扇区"
    source: board
    when_any:
      - "reallocated sectors count"
    any_of:
      - pattern: "5\\s+\\d+\\s+[1-9]\\d*\\s+Reallocated Sectors Count"
        regex: true
root_causes:
  - id: R1
    name: "SSD I/O error"
    all:
      - E1
    mechanism: "SSD 读写或命令执行失败。"
    case_keywords: ["i/o", "io error", "blk_update", "read log dma"]
    confidence: medium
  - id: R2
    name: "SSD SATA 链路异常"
    all:
      - E2
    excludes:
      - E1
    mechanism: "SSD SATA 链路协商或复位失败。"
    case_keywords: ["comreset", "sata", "ata bus", "softreset", "serror"]
    confidence: medium
  - id: R3
    name: "SSD 寿命耗尽"
    all:
      - E3
    excludes:
      - E1
      - E2
    mechanism: "SMART Remain Life Percentage 原始值低于 30，SSD 剩余寿命不足。"
    case_keywords: ["寿命", "remain life"]
    confidence: medium
  - id: R4
    name: "SSD 扇区介质异常"
    any:
      - E4
      - E5
    excludes:
      - E1
      - E2
    mechanism: "SMART 报告不可修复或重映射扇区。"
    case_keywords: ["扇区", "uncorrectable", "reallocated", "sector"]
    confidence: medium
reasoning:
  strategy: "先找内核里的 I/O 与 SATA 直接错误，再看 BoardInit 的 SMART 退化；直接 I/O/SATA 优先于 SMART，寿命耗尽优先于扇区介质异常。"
  hints:
    - {keyword: "内核", rule_ids: ["E1", "E2"]}
    - {keyword: "i/o", rule_ids: ["E1"]}
    - {keyword: "sata", rule_ids: ["E2"]}
    - {keyword: "smart", rule_ids: ["E3", "E4", "E5"]}
    - {keyword: "寿命", rule_ids: ["E3"]}
    - {keyword: "扇区", rule_ids: ["E4", "E5"]}
  pitfalls:
    - "SATA link down 可能是未使用端口，不能单独当 SSD 故障；要看 COMRESET failed、ATA bus error 等直接错误。"
    - "SMART 的 raw_value 是每行第三个数值，不能把 current 值或序号当阈值。"
    - "Remain Life Percentage 等于 30 不算低于 30；只有小于 30 才判寿命耗尽。"
    - "Uncorrectable/Reallocated 必须大于 0；0 是正常。寿命与扇区同时异常时，优先寿命耗尽。"
  stop_conditions:
    - "E1 成立：直接判 SSD I/O error，停止扩根因。"
    - "E2 成立且 E1 不成立：判 SATA 链路异常，停止。"
    - "E3 成立且 E1/E2 不成立：判寿命耗尽，停止。"
    - "E4 或 E5 成立且 E1/E2/E3 不成立：判扇区介质异常，停止。"
